
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shortly</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>
<body class="auth-page">

    <header class="navbar">
        <a href="index.html" class="logo">shortly<span>.</span></a>
        <a href="index.html">Home</a>
    </header>

    <main class="auth-container">
        <a href="index.html" class="auth-back">← Back to home</a>

        <div class="auth-heading">
            <h1>Welcome back</h1>
            <p>Log in to create and manage your short links.</p>
        </div>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" required autocomplete="email"
                       placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required
                       autocomplete="current-password" placeholder="Enter password">
            </div>

            <button type="submit" class="auth-submit" id="loginButton">
                Login
            </button>

            <p id="loginMessage" class="auth-message" role="status"></p>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="register.html">Register</a>
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/login.js"></script>
</body>
</html>
