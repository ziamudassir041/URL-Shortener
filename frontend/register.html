
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Shortly</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>
<body class="auth-page">

    <header class="navbar">
        <a href="index.html" class="logo">shortly<span>.</span></a>
        <a href="index.html">Home</a>
    </header>

    <main class="auth-container">
        <a href="index.html" class="auth-back">← Back to home</a>

        <div class="auth-heading">
            <h1>Create your account</h1>
            <p>Get started with your own custom short links.</p>
        </div>

        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label for="name">Full name</label>
                <input type="text" id="name" required minlength="3" maxlength="30"
                       autocomplete="name" placeholder="Your name">
            </div>

            <div class="form-group">
                <label for="registerEmail">Email address</label>
                <input type="email" id="registerEmail" required
                       autocomplete="email" placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" required
                       minlength="8" autocomplete="new-password"
                       placeholder="At least 8 characters">
            </div>

            <button type="submit" class="auth-submit" id="registerButton">
                Create account
            </button>

            <p id="registerMessage" class="auth-message" role="status"></p>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="login.html">Login</a>
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/register.js"></script>
</body>
</html>
